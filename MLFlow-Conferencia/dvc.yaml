# Pipeline del taller. Ejecuta el notebook completo en modo no interactivo.
# Uso:  dvc repro      (reejecuta solo lo que cambió)
#       dvc exp run    (reejecuta registrando un experimento con otros parámetros)
stages:
  entrenar:
    cmd: jupyter nbconvert --to notebook --execute --inplace notebooks/TalleV2r_MLOps_Calidad_Vino_ISO42001.ipynb
    deps:
      - notebooks/TalleV2r_MLOps_Calidad_Vino_ISO42001.ipynb
      - data/raw/winequality-red.csv
    params:
      - taller
    outs:
      - models/modelo_vino.joblib
    metrics:
      - governance/evidencia_modelo_vino.json:
          cache: false
